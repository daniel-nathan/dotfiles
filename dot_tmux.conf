# Pronto para uso, mas o auto-start permanece desativado em ~/.zshrc.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on

set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message "tmux.conf recarregado"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-position bottom
set -g status-left " #[bold]#S "
set -g status-right "#(whoami)@#H  %Y-%m-%d %H:%M "

# Tema gruvbox (mesma paleta do Ghostty e do perfil Gruvbox do Konsole)
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g window-status-current-style "bg=#d79921,fg=#282828,bold"
set -g pane-active-border-style "fg=#d79921"
set -g pane-border-style "fg=#3c3836"
set -g message-style "bg=#d79921,fg=#282828"

# Popup rapido pro lazydocker (fecha sozinho ao sair)
bind g display-popup -E -w 90% -h 90% "lazydocker"

# Plugins (gerenciados pelo TPM: prefix + I instala, prefix + U atualiza)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

run -b '~/.tmux/plugins/tpm/tpm'
